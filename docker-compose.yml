services:

  auth-service:
    container_name: auth-service

    build: 
      context: ./auth
      dockerfile: Dockerfile

    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=1
      - SHOP_USERNAME=shop
      - SHOP_PASSWORD=1
      - DB_URL=jdbc:mariadb://auth-db:3306/auth
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - SERVER_BANK_URL=http://bank-nginx
      - INTERNAL_API_SECRET=b8f2a9c1-4e3d-4a7b-9f1e-6d5c8a2b3e4f
    depends_on:
      auth-db: 
        condition: service_healthy

  auth-db:
    image: mariadb
    container_name: auth-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth  
    ports:
      - "33062:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  auth-php-gateway:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: auth-php-gateway
    environment:
      - JAVA_HOST=auth-service
      - JAVA_PORT=12345
      - REDIS_HOST=auth-redis
      - REDIS_PORT=6379
      - INTERNAL_API_SECRET=b8f2a9c1-4e3d-4a7b-9f1e-6d5c8a2b3e4f
      - KONG_API_KEY=d4f8e2a1-7b3c-4f9e-a6d5-8c1b2e3f4a5d
    depends_on:
      auth-service:
        condition: service_started

  auth-nginx:
    image: nginx:alpine
    container_name: auth-nginx
    volumes:
      - ./php:/usr/src/myapp
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-php-gateway

  auth-redis:
    image: redis
    container_name: auth-redis
    restart: always

volumes:
  auth_db_data: